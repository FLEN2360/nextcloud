# version: '3.8'

services:
  mariadb:
    container_name: mariadb
    image: mariadb:10.11.6
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./docker/mariadb/data:/var/lib/mysql
      - ./docker/mariadb/config:/etc/mysql/conf.d
      - ./docker/mariadb/logs:/var/log/mysql
    networks:
      - internal
  nextcloud:
    container_name: nextcloud
    build:
      context: ./docker/nextcloud
    restart: always
    env_file: .env
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./docker/nextcloud/html:/var/www/html
      - ./docker/nextcloud/config/php.ini:/usr/local/etc/php/conf.d/nextcloud.ini
      - ./docker/nextcloud/logs:/var/log/nextcloud
    networks:
      - internal
      - proxy
    depends_on:
      - mariadb
  nginx:
    container_name: nginx
    build:
      context: ./docker/nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./docker/nextcloud/html:/var/www/html
      - ./docker/nginx/config/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/config/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/config/templates:/etc/nginx/templates/
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/logs:/var/log/nginx
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - nextcloud
    networks:
      - proxy

networks:
  internal:
    driver: bridge
  proxy:
    driver: bridge