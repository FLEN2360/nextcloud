memory_limit=512M
upload_max_filesize=32G
post_max_size=1024M
opcache.enable=1
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.memory_consumption=128
opcache.save_comments=1
# max_children = (總記憶體 - 預留記憶體) / 每個 PHP-FPM 子程序佔用 ( 30~80MB )
pm = dynamic
pm.max_children = 120

